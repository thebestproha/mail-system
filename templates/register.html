<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Register</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='image.png') }}" class="app-logo" alt="EditMail Logo">
      <h1>EditMail Distributed System</h1>
    </div>

    <main class="auth-card" aria-labelledby="register-title">
      <h2 id="register-title">Create account</h2>
      <p class="auth-subtitle">Start using secure distributed mail in under a minute.</p>

      <form method="post" action="/register">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" required autocomplete="username" placeholder="Choose username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="new-password" placeholder="Choose password" />
        </div>

        <div class="auth-actions">
          <button class="btn btn-success" type="submit">Register</button>
        </div>
      </form>

      <div class="auth-links">
        <span>Already have an account? <a href="/login">Login</a></span>
      </div>
    </main>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/sw.js");
      });
    }
  </script>
</body>
</html>
