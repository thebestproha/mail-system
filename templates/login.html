<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; padding:24px; }
    .topbar { max-width:420px; margin:0 auto 10px; display:flex; align-items:center; }
    .app-logo {
      height: 40px;
      width: auto;
      margin-right: 10px;
      vertical-align: middle;
    }
    .app-title { font-size:1rem; font-weight:700; color:#111827; }
    .card { max-width:420px; margin:40px auto; background:#fff; border:1px solid #d1d5db; border-radius:10px; padding:18px; }
    h2 { margin-top:0; }
    label { display:block; margin-top:10px; font-weight:600; }
    input { width:100%; padding:9px; margin-top:6px; border:1px solid #d1d5db; border-radius:6px; box-sizing:border-box; }
    button { margin-top:14px; width:100%; padding:10px; border:none; border-radius:6px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; }
    a { color:#2563eb; text-decoration:none; }
  </style>
</head>
<body>
  <div class="topbar">
    <img src="{{ url_for('static', filename='logo.png') }}" class="app-logo" alt="MiniMail Logo">
    <div class="app-title">MiniMail Distributed System</div>
  </div>
  <div class="card">
    <h2>User Login</h2>
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input id="username" name="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button type="submit">Login</button>
    </form>
    <p>New user? <a href="/register">Create account</a></p>
    <p><a href="/dashboard">Open admin dashboard</a></p>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/sw.js");
      });
    }
  </script>
</body>
</html>
