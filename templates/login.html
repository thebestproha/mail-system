<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-brand">
      <img src="{{ url_for('static', filename='logo.png') }}" class="app-logo" alt="MiniMail Logo">
      <h1>MiniMail Distributed System</h1>
    </div>

    <main class="auth-card" aria-labelledby="login-title">
      <h2 id="login-title">Welcome back</h2>
      <p class="auth-subtitle">Sign in to access your distributed mailbox.</p>

      <form method="post" action="/login">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" required autocomplete="username" placeholder="Enter username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter password" />
        </div>

        <div class="auth-actions">
          <button class="btn btn-primary" type="submit">Login</button>
        </div>
      </form>

      <div class="auth-links">
        <span>New user? <a href="/register">Create account</a></span>
        <span><a href="/dashboard">Open admin dashboard</a></span>
      </div>
    </main>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/sw.js");
      });
    }
  </script>
</body>
</html>
