<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>User Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="mail-page">
  <aside class="mail-sidebar">
    <div class="mail-brand">
      <img src="{{ url_for('static', filename='image.png') }}" class="app-logo" alt="MiniMail Logo">
      <h1>MiniMail<br>Distributed System</h1>
    </div>

    <button id="open-compose" class="btn btn-primary compose-btn" type="button">✉ Compose</button>

    <nav class="mail-nav" aria-label="Mailbox">
      <button id="nav-inbox" class="btn nav-btn active" type="button">Inbox</button>
      <button id="nav-sent" class="btn nav-btn" type="button">Sent</button>
      <button id="connect-gmail" class="btn nav-btn" type="button">Connect Gmail</button>
      <button id="send-gmail" class="btn nav-btn" type="button" style="display:none;">Send via Gmail</button>
      <button id="logout-gmail" class="btn nav-btn" type="button" style="display:none;">Disconnect Gmail</button>
      <a class="btn nav-btn" href="/login">Logout</a>
    </nav>

    <div class="mail-user">
      Logged in as<br>
      <strong id="current-user"></strong>
    </div>
  </aside>

  <main class="mail-main">
    <section class="mail-list-panel">
      <div class="panel-head">
        <h2 id="mailbox-title">Inbox</h2>
        <div class="panel-tools">
          <button id="refresh-btn" class="btn btn-ghost" type="button">Refresh</button>
          <button id="clear-btn" class="btn btn-danger" type="button">Clear</button>
        </div>
      </div>

      <div id="message-list" class="message-list" aria-live="polite"></div>

      <div class="sr-only">
        <button id="refresh-inbox" type="button">Refresh Inbox</button>
        <button id="clear-inbox" type="button">Clear Inbox History</button>
        <button id="refresh-sent" type="button">Refresh Sent</button>
        <button id="clear-sent" type="button">Clear Sent History</button>
      </div>
    </section>

    <section class="mail-detail-panel">
      <article class="detail-card">
        <div class="detail-head">
          <div>
            <h3 id="detail-title">Select a message</h3>
            <div id="detail-meta" class="detail-meta"></div>
          </div>
          <div id="detail-status"></div>
        </div>

        <div id="detail-content" class="detail-content detail-empty">Choose a message from the list to view details.</div>

        <div id="detail-actions" class="detail-actions"></div>

        <div id="action-result" class="message-feedback" role="status" aria-live="polite"></div>
      </article>
    </section>

    <section class="mail-list-panel">
      <div class="panel-head">
        <h2>Gmail Inbox</h2>
        <div class="panel-tools">
          <button id="gmail-refresh" class="btn btn-ghost" type="button">Refresh Gmail</button>
        </div>
      </div>
      <div id="gmail-status" class="message-feedback" role="status" aria-live="polite"></div>
      <div id="gmail-inbox-list" class="message-list" aria-live="polite"></div>
    </section>
  </main>

  <section id="compose-panel" class="compose-panel" aria-label="Compose message">
    <div class="compose-head">
      <h3>New Message</h3>
      <button id="close-compose" class="btn btn-ghost" type="button">Close</button>
    </div>

    <div class="compose-body">
      <div class="form-group">
        <label for="receiver">Receiver</label>
        <input id="receiver" placeholder="Recipient username" />
      </div>

      <div class="form-group">
        <label for="content">Message</label>
        <textarea id="content" placeholder="Write your message"></textarea>
      </div>

      <div class="compose-foot">
        <div id="send-result" class="message-feedback" role="status" aria-live="polite"></div>
        <button id="send-btn" class="btn btn-primary" type="button">Send</button>
      </div>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get("username") || "";
    document.getElementById("current-user").textContent = username || "Unknown";
    const state = {
      currentBox: "inbox",
      inbox: [],
      sent: [],
      selectedId: null,
    };

    const composePanel = document.getElementById("compose-panel");
    let gmailConnected = false;

    function setFeedback(target, message, type = "") {
      target.textContent = message || "";
      target.className = `message-feedback${type ? ` ${type}` : ""}`;
    }

    function openCompose() {
      composePanel.classList.add("open");
      document.getElementById("receiver").focus();
    }

    function closeCompose() {
      composePanel.classList.remove("open");
    }

    function useBox(box) {
      state.currentBox = box;
      state.selectedId = null;
      document.getElementById("mailbox-title").textContent = box === "inbox" ? "Inbox" : "Sent";
      document.getElementById("nav-inbox").classList.toggle("active", box === "inbox");
      document.getElementById("nav-sent").classList.toggle("active", box === "sent");
      renderCurrentList();
      renderSelectedMessage();
    }

    function previewText(content) {
      return String(content || "").replace(/\n/g, " ").slice(0, 96) || "No content";
    }

    function updateGmailControls() {
      document.getElementById("send-gmail").style.display = gmailConnected ? "block" : "none";
      document.getElementById("logout-gmail").style.display = gmailConnected ? "block" : "none";
    }

    function renderGmailInbox(messages) {
      const list = document.getElementById("gmail-inbox-list");
      list.innerHTML = "";

      if (!messages.length) {
        const empty = document.createElement("div");
        empty.className = "message-card";
        empty.innerHTML = `<p class="message-title">No Gmail messages</p><p class="message-preview">Connect Gmail and refresh to see recent messages.</p>`;
        list.appendChild(empty);
        return;
      }

      for (const message of messages) {
        const card = document.createElement("article");
        card.className = "message-card";
        card.innerHTML = `
          <div class="message-row">
            <p class="message-title">${message.subject || "(No subject)"}</p>
            <p class="message-time">#${message.id || "-"}</p>
          </div>
          <p class="message-preview">From: ${message.sender || "Unknown"}</p>
          <p class="message-preview">${message.snippet || ""}</p>
        `;
        list.appendChild(card);
      }
    }

    async function loadGmailStatus() {
      const status = document.getElementById("gmail-status");
      if (!username) {
        gmailConnected = false;
        updateGmailControls();
        setFeedback(status, "Log in to connect Gmail.");
        return;
      }

      try {
        const response = await fetch(`/gmail/status?username=${encodeURIComponent(username)}`);
        const data = await response.json();
        gmailConnected = Boolean(data.connected);
        updateGmailControls();
        if (!data.oauth_configured) {
          setFeedback(status, "Google OAuth env vars are missing on server.", "error");
          return;
        }
        setFeedback(status, gmailConnected ? "Gmail connected" : "Gmail not connected");
      } catch (error) {
        gmailConnected = false;
        updateGmailControls();
        setFeedback(status, "Unable to read Gmail status", "error");
      }
    }

    async function loadGmailInbox() {
      const status = document.getElementById("gmail-status");
      if (!username) {
        renderGmailInbox([]);
        return;
      }

      try {
        const response = await fetch(`/gmail/inbox?username=${encodeURIComponent(username)}`);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Unable to fetch Gmail inbox");
        }
        renderGmailInbox(data.messages || []);
      } catch (error) {
        renderGmailInbox([]);
        setFeedback(status, error.message, "error");
      }
    }

    async function sendViaGmail() {
      const status = document.getElementById("gmail-status");
      const to = window.prompt("Recipient email address");
      if (to === null) return;
      const subject = window.prompt("Subject");
      if (subject === null) return;
      const body = window.prompt("Message body");
      if (body === null) return;

      try {
        const response = await fetch("/gmail/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, to, subject, body })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Gmail send failed");
        }
        setFeedback(status, "Email sent via Gmail", "success");
        await loadGmailInbox();
      } catch (error) {
        setFeedback(status, error.message, "error");
      }
    }

    async function disconnectGmail() {
      const status = document.getElementById("gmail-status");
      try {
        const response = await fetch("/gmail/logout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username })
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Disconnect failed");
        }
        gmailConnected = false;
        updateGmailControls();
        renderGmailInbox([]);
        setFeedback(status, "Gmail disconnected", "success");
      } catch (error) {
        setFeedback(status, error.message, "error");
      }
    }

    function activeMessages() {
      return state.currentBox === "inbox" ? state.inbox : state.sent;
    }

    function selectedMessage() {
      return activeMessages().find((message) => String(message.id) === String(state.selectedId)) || null;
    }

    function statusBadge(status) {
      const normalized = String(status || "").toUpperCase();
      const cls = normalized === "READ" ? "status-read" : "status-unread";
      return `<span class="pill ${cls}">${normalized || "UNKNOWN"}</span>`;
    }

    function renderCurrentList() {
      const container = document.getElementById("message-list");
      const messages = activeMessages();
      container.innerHTML = "";

      if (!messages.length) {
        const empty = document.createElement("div");
        empty.className = "message-card";
        empty.innerHTML = `<p class="message-title">No messages</p><p class="message-preview">Nothing to display in ${state.currentBox}.</p>`;
        container.appendChild(empty);
        return;
      }

      for (const message of messages) {
        const card = document.createElement("article");
        card.className = `message-card${String(message.id) === String(state.selectedId) ? " active" : ""}`;
        const title = state.currentBox === "inbox"
          ? `From: ${message.sender || "-"}`
          : `To: ${message.receiver || "-"}`;

        card.innerHTML = `
          <div class="message-row">
            <p class="message-title">${title}</p>
            <p class="message-time">${message.timestamp_sent || "-"}</p>
          </div>
          <div class="message-row">
            ${statusBadge(message.status)}
            <span class="message-time">#${message.id}</span>
          </div>
          <p class="message-preview">${previewText(message.content)}</p>
        `;

        card.addEventListener("click", () => {
          state.selectedId = message.id;
          renderCurrentList();
          renderSelectedMessage();
        });

        container.appendChild(card);
      }
    }

    function renderSelectedMessage() {
      const message = selectedMessage();
      const title = document.getElementById("detail-title");
      const meta = document.getElementById("detail-meta");
      const status = document.getElementById("detail-status");
      const content = document.getElementById("detail-content");
      const actions = document.getElementById("detail-actions");

      if (!message) {
        title.textContent = "Select a message";
        meta.innerHTML = "";
        status.innerHTML = "";
        content.className = "detail-content detail-empty";
        content.textContent = "Choose a message from the list to view details.";
        actions.innerHTML = "";
        return;
      }

      title.textContent = state.currentBox === "inbox"
        ? `From ${message.sender || "-"}`
        : `To ${message.receiver || "-"}`;
      meta.innerHTML = `
        <span>ID: ${message.id}</span>
        <span>Server: ${message.server_id || "-"}</span>
        <span>Timestamp: ${message.timestamp_sent || "-"}</span>
      `;
      status.innerHTML = statusBadge(message.status);
      content.className = "detail-content";
      content.textContent = message.content || "";
      actions.innerHTML = "";

      if (state.currentBox === "sent" && String(message.status || "").toUpperCase() === "UNREAD") {
        const editButton = document.createElement("button");
        editButton.className = "btn btn-primary";
        editButton.type = "button";
        editButton.textContent = "Edit";
        editButton.addEventListener("click", () => editSentMessage(message.id, message.content || ""));

        const deleteButton = document.createElement("button");
        deleteButton.className = "btn btn-danger";
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteSentMessage(message.id));

        actions.appendChild(editButton);
        actions.appendChild(deleteButton);
      }
    }

    async function editSentMessage(messageId, currentContent) {
      const actionResult = document.getElementById("action-result");
      const updatedContent = window.prompt("Edit message content", currentContent);

      if (updatedContent === null) {
        return;
      }

      try {
        const response = await fetch(`/edit-message/${encodeURIComponent(messageId)}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: updatedContent })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "edit failed");
        }

        setFeedback(actionResult, `edited message ${messageId}`, "success");
        await loadSent();
      } catch (error) {
        setFeedback(actionResult, error.message, "error");
      }
    }

    async function deleteSentMessage(messageId) {
      const actionResult = document.getElementById("action-result");
      const confirmed = window.confirm(`Delete message ${messageId}?`);
      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(`/delete-message/${encodeURIComponent(messageId)}`, {
          method: "DELETE"
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "delete failed");
        }

        setFeedback(actionResult, `deleted message ${messageId}`, "success");
        await loadSent();
      } catch (error) {
        setFeedback(actionResult, error.message, "error");
      }
    }

    async function clearSentHistory() {
      const actionResult = document.getElementById("action-result");
      if (!username) {
        return;
      }

      const confirmed = window.confirm("Clear all sent history for this user?");
      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(`/sent-history/${encodeURIComponent(username)}`, {
          method: "DELETE"
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "clear history failed");
        }

        setFeedback(actionResult, `cleared ${data.deleted || 0} sent messages`, "success");
        await loadSent();
      } catch (error) {
        setFeedback(actionResult, error.message, "error");
      }
    }

    async function clearInboxHistory() {
      const actionResult = document.getElementById("action-result");
      if (!username) {
        return;
      }

      const confirmed = window.confirm("Clear all inbox history for this user?");
      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(`/inbox-history/${encodeURIComponent(username)}`, {
          method: "DELETE"
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "clear inbox failed");
        }

        setFeedback(actionResult, `cleared ${data.deleted || 0} inbox messages`, "success");
        await loadInbox();
      } catch (error) {
        setFeedback(actionResult, error.message, "error");
      }
    }

    async function loadInbox() {
      if (!username) return;
      const response = await fetch(`/inbox/${encodeURIComponent(username)}`);
      state.inbox = await response.json();
      if (state.currentBox === "inbox") {
        renderCurrentList();
        renderSelectedMessage();
      }
    }

    async function loadSent() {
      if (!username) return;
      const response = await fetch(`/sent/${encodeURIComponent(username)}`);
      state.sent = await response.json();
      if (state.currentBox === "sent") {
        renderCurrentList();
        renderSelectedMessage();
      }
    }

    async function refreshCurrentBox() {
      if (state.currentBox === "inbox") {
        await loadInbox();
        return;
      }
      await loadSent();
    }

    async function clearCurrentBox() {
      if (state.currentBox === "inbox") {
        await clearInboxHistory();
        return;
      }
      await clearSentHistory();
    }

    async function sendMessage() {
      const receiver = document.getElementById("receiver").value.trim();
      const content = document.getElementById("content").value.trim();
      const result = document.getElementById("send-result");

      if (!username || !receiver || !content) {
        setFeedback(result, "username, receiver and content are required", "error");
        return;
      }

      const id = Date.now();
      const payload = { id, sender: username, receiver, content };

      try {
        const response = await fetch("/route", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "send failed");
        }

        setFeedback(result, `sent via ${data.routed_to}`, "success");
        document.getElementById("content").value = "";
        document.getElementById("receiver").value = "";
        await loadSent();
        useBox("sent");
        closeCompose();
      } catch (error) {
        setFeedback(result, error.message, "error");
      }
    }

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    document.getElementById("refresh-inbox").addEventListener("click", loadInbox);
    document.getElementById("clear-inbox").addEventListener("click", clearInboxHistory);
    document.getElementById("refresh-sent").addEventListener("click", loadSent);
    document.getElementById("clear-sent").addEventListener("click", clearSentHistory);
    document.getElementById("refresh-btn").addEventListener("click", refreshCurrentBox);
    document.getElementById("clear-btn").addEventListener("click", clearCurrentBox);
    document.getElementById("nav-inbox").addEventListener("click", () => useBox("inbox"));
    document.getElementById("nav-sent").addEventListener("click", () => useBox("sent"));
    document.getElementById("connect-gmail").addEventListener("click", () => {
      if (!username) {
        setFeedback(document.getElementById("gmail-status"), "username missing", "error");
        return;
      }
      window.location.href = `/gmail/login?username=${encodeURIComponent(username)}`;
    });
    document.getElementById("send-gmail").addEventListener("click", sendViaGmail);
    document.getElementById("logout-gmail").addEventListener("click", disconnectGmail);
    document.getElementById("gmail-refresh").addEventListener("click", loadGmailInbox);
    document.getElementById("open-compose").addEventListener("click", openCompose);
    document.getElementById("close-compose").addEventListener("click", closeCompose);

    loadInbox();
    loadSent();
    useBox("inbox");
    loadGmailStatus().then(loadGmailInbox);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/sw.js");
      });
    }
  </script>
</body>
</html>
