<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>MiniMail Hybrid Client</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    .hybrid-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-secondary) 80%, transparent);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 3;
    }

    .source-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      background: var(--bg-secondary);
    }

    .source-toggle button {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 8px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .source-toggle button.active {
      background: var(--accent);
      color: #fff;
    }

    .mail-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .folder-list {
      display: grid;
      gap: 8px;
    }

    .folder-btn {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-weight: 600;
    }

    .folder-btn.active,
    .folder-btn:hover {
      border-color: var(--border);
      background: color-mix(in srgb, var(--bg-secondary) 76%, transparent);
    }

    .hybrid-main {
      display: grid;
      grid-template-columns: minmax(300px, 420px) 1fr;
      min-height: calc(100vh - 67px);
    }

    .mail-list-panel,
    .mail-detail-panel {
      transition: all var(--transition-fast);
    }

    .message-card {
      border-radius: 14px;
    }

    .compose-modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .compose-modal-bg.open {
      display: flex;
    }

    .compose-modal {
      width: min(620px, 100%);
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      box-shadow: var(--shadow-md);
      transform: translateY(6px);
      animation: composeIn 0.2s ease forwards;
    }

    @keyframes composeIn {
      to {
        transform: translateY(0);
      }
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      box-shadow: var(--shadow-md);
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 60;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1080px) {
      .hybrid-main {
        grid-template-columns: 1fr;
      }

      .mail-detail-panel {
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>
<body class="mail-page">
  <div class="mail-layout">
    <aside class="mail-sidebar">
      <div class="mail-brand">
        <img src="{{ url_for('static', filename='image.png') }}" class="app-logo" alt="MiniMail Logo">
        <h1>MiniMail<br>Hybrid Mail</h1>
      </div>

      <button id="compose-open" class="btn btn-primary compose-btn" type="button">✉ Compose</button>

      <div class="folder-list" aria-label="Folders">
        <button class="folder-btn active" data-folder="inbox" type="button">Inbox</button>
        <button class="folder-btn" data-folder="sent" type="button">Sent</button>
        <button class="folder-btn" data-folder="starred" type="button">Starred</button>
        <button class="folder-btn" data-folder="trash" type="button">Trash</button>
        <button class="folder-btn" data-folder="junk" type="button">Junk</button>
      </div>

      <a class="btn nav-btn" href="/login">Logout</a>

      <div class="mail-user">
        Logged in as<br>
        <strong id="current-user"></strong>
      </div>
    </aside>

    <div>
      <header class="hybrid-topbar">
        <div class="source-toggle" role="group" aria-label="Source Toggle">
          <button id="source-internal" class="active" type="button">Internal Mail</button>
          <button id="source-external" type="button">External Mail</button>
        </div>
        <div class="panel-tools">
          <button id="refresh-btn" class="btn btn-ghost" type="button">Refresh</button>
          <button id="empty-trash-btn" class="btn btn-danger" type="button" style="display:none;">Empty Trash</button>
          <button id="connect-gmail" class="btn btn-ghost" type="button">Connect Gmail</button>
        </div>
      </header>

      <main class="hybrid-main">
        <section class="mail-list-panel">
          <div class="panel-head">
            <h2 id="folder-title">Inbox</h2>
            <div id="list-status" class="message-feedback"></div>
          </div>
          <div id="message-list" class="message-list" aria-live="polite"></div>
        </section>

        <section class="mail-detail-panel">
          <article class="detail-card">
            <div class="detail-head">
              <div>
                <h3 id="detail-subject">Select a message</h3>
                <div id="detail-meta" class="detail-meta"></div>
              </div>
              <div id="detail-status"></div>
            </div>

            <div id="detail-content" class="detail-content detail-empty">Choose a message to view details.</div>
            <div id="detail-actions" class="detail-actions"></div>
            <div id="detail-result" class="message-feedback" role="status" aria-live="polite"></div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <div id="compose-modal-bg" class="compose-modal-bg" aria-hidden="true">
    <div class="compose-modal">
      <div class="compose-head">
        <h3>Compose Message</h3>
        <button id="compose-close" class="btn btn-ghost" type="button">Close</button>
      </div>
      <div class="compose-body">
        <div class="form-group">
          <label for="compose-to">To</label>
          <input id="compose-to" placeholder="user@editmail.com or email@gmail.com" />
        </div>
        <div class="form-group">
          <label for="compose-subject">Subject</label>
          <input id="compose-subject" placeholder="Subject" />
        </div>
        <div class="form-group">
          <label for="compose-body">Body</label>
          <textarea id="compose-body" placeholder="Write your message"></textarea>
        </div>
        <div class="compose-foot">
          <div id="compose-result" class="message-feedback" role="status" aria-live="polite"></div>
          <button id="compose-send" class="btn btn-primary" type="button">Send</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get("username") || "";
    document.getElementById("current-user").textContent = username || "Unknown";

    const state = {
      source: "internal",
      folder: "inbox",
      messages: [],
      selectedId: null,
      gmailConnected: false,
    };

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function setFeedback(target, message, type = "") {
      target.textContent = message || "";
      target.className = `message-feedback${type ? ` ${type}` : ""}`;
    }

    function statusBadge(status) {
      const value = String(status || "UNREAD").toUpperCase();
      const cls = value === "READ" ? "status-read" : "status-unread";
      return `<span class="pill ${cls}">${value}</span>`;
    }

    function activeMessage() {
      return state.messages.find((m) => String(m.id) === String(state.selectedId)) || null;
    }

    function setFolder(folder) {
      state.folder = folder;
      state.selectedId = null;
      document.getElementById("folder-title").textContent = folder[0].toUpperCase() + folder.slice(1);
      document.querySelectorAll(".folder-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.folder === folder);
      });
      document.getElementById("empty-trash-btn").style.display = folder === "trash" ? "inline-flex" : "none";
      loadMessages();
    }

    async function checkGmailConnection() {
      try {
        const response = await fetch(`/gmail/status?username=${encodeURIComponent(username)}`);
        const data = await response.json();
        state.gmailConnected = Boolean(data.connected);
        document.getElementById("connect-gmail").textContent = state.gmailConnected ? "Gmail Connected" : "Connect Gmail";
      } catch {
        document.getElementById("connect-gmail").textContent = "Connect Gmail";
      }
    }

    async function loadMessages() {
      const status = document.getElementById("list-status");
      setFeedback(status, "Loading...");
      try {
        const response = await fetch(`/mail/list?username=${encodeURIComponent(username)}&source=${encodeURIComponent(state.source)}&folder=${encodeURIComponent(state.folder)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "failed to load messages");
        state.messages = data.messages || [];
        renderList();
        renderDetail();
        setFeedback(status, `${state.messages.length} messages`);
      } catch (error) {
        state.messages = [];
        renderList();
        renderDetail();
        setFeedback(status, error.message, "error");
      }
    }

    function renderList() {
      const list = document.getElementById("message-list");
      list.innerHTML = "";
      if (!state.messages.length) {
        const empty = document.createElement("div");
        empty.className = "message-card";
        empty.innerHTML = `<p class="message-title">No messages</p><p class="message-preview">Nothing in ${state.folder}.</p>`;
        list.appendChild(empty);
        return;
      }

      for (const message of state.messages) {
        const card = document.createElement("article");
        card.className = `message-card${String(message.id) === String(state.selectedId) ? " active" : ""}`;
        card.innerHTML = `
          <div class="message-row">
            <p class="message-title">${message.subject || "(No subject)"}</p>
            <p class="message-time">${message.timestamp_sent || ""}</p>
          </div>
          <div class="message-row">
            ${statusBadge(message.status)}
            <span class="message-time">${message.sender || message.receiver || ""}</span>
          </div>
          <p class="message-preview">${message.content || message.snippet || ""}</p>
        `;
        card.addEventListener("click", () => {
          state.selectedId = message.id;
          renderList();
          renderDetail();
        });
        list.appendChild(card);
      }
    }

    function renderDetail() {
      const message = activeMessage();
      const subject = document.getElementById("detail-subject");
      const meta = document.getElementById("detail-meta");
      const status = document.getElementById("detail-status");
      const content = document.getElementById("detail-content");
      const actions = document.getElementById("detail-actions");

      if (!message) {
        subject.textContent = "Select a message";
        meta.innerHTML = "";
        status.innerHTML = "";
        content.className = "detail-content detail-empty";
        content.textContent = "Choose a message to view details.";
        actions.innerHTML = "";
        return;
      }

      subject.textContent = message.subject || "(No subject)";
      meta.innerHTML = `
        <span>From: ${message.sender || "-"}</span>
        <span>To: ${message.receiver || "-"}</span>
        <span>ID: ${message.id || "-"}</span>
      `;
      status.innerHTML = statusBadge(message.status);
      content.className = "detail-content";
      content.textContent = message.content || message.snippet || "";

      actions.innerHTML = "";

      const starBtn = document.createElement("button");
      starBtn.className = "btn btn-ghost";
      starBtn.type = "button";
      starBtn.textContent = message.is_starred ? "Unstar" : "Star";
      starBtn.addEventListener("click", () => updateStar(message));
      actions.appendChild(starBtn);

      const spamBtn = document.createElement("button");
      spamBtn.className = "btn btn-ghost";
      spamBtn.type = "button";
      spamBtn.textContent = message.is_spam ? "Not Junk" : "Mark Junk";
      spamBtn.addEventListener("click", () => updateSpam(message));
      actions.appendChild(spamBtn);

      const trashBtn = document.createElement("button");
      trashBtn.className = "btn btn-danger";
      trashBtn.type = "button";
      trashBtn.textContent = "Move to Trash";
      trashBtn.addEventListener("click", () => moveToTrash(message));
      actions.appendChild(trashBtn);
    }

    async function updateStar(message) {
      const result = document.getElementById("detail-result");
      try {
        const response = await fetch("/mail/star", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username,
            source: state.source,
            message_id: message.id,
            is_starred: !message.is_starred,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "star failed");
        setFeedback(result, data.message || "Star updated", "success");
        await loadMessages();
      } catch (error) {
        setFeedback(result, error.message, "error");
      }
    }

    async function updateSpam(message) {
      const result = document.getElementById("detail-result");
      try {
        const response = await fetch("/mail/spam", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username,
            source: state.source,
            message_id: message.id,
            is_spam: !message.is_spam,
          }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "junk update failed");
        setFeedback(result, data.message || "Junk updated", "success");
        await loadMessages();
      } catch (error) {
        setFeedback(result, error.message, "error");
      }
    }

    async function moveToTrash(message) {
      const result = document.getElementById("detail-result");
      try {
        const response = await fetch("/mail/trash", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, source: state.source, message_id: message.id }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "move to trash failed");
        setFeedback(result, data.message || "Moved to trash", "success");
        await loadMessages();
      } catch (error) {
        setFeedback(result, error.message, "error");
      }
    }

    async function emptyTrash() {
      const result = document.getElementById("detail-result");
      if (!window.confirm("Empty trash for current source?")) return;
      try {
        const response = await fetch(`/mail/trash/empty?username=${encodeURIComponent(username)}&source=${encodeURIComponent(state.source)}`, {
          method: "DELETE",
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "empty trash failed");
        setFeedback(result, `${data.message} (${data.deleted || 0})`, "success");
        await loadMessages();
      } catch (error) {
        setFeedback(result, error.message, "error");
      }
    }

    function openCompose() {
      document.getElementById("compose-modal-bg").classList.add("open");
      document.getElementById("compose-to").focus();
    }

    function closeCompose() {
      document.getElementById("compose-modal-bg").classList.remove("open");
    }

    async function sendCompose() {
      const to = document.getElementById("compose-to").value.trim();
      const subject = document.getElementById("compose-subject").value.trim();
      const body = document.getElementById("compose-body").value.trim();
      const feedback = document.getElementById("compose-result");

      if (!username || !to || !subject || !body) {
        setFeedback(feedback, "to, subject, and body are required", "error");
        return;
      }

      try {
        const response = await fetch("/mail/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, to, subject, body }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "send failed");

        setFeedback(feedback, data.toast || "Message sent", "success");
        showToast(data.toast || "Message sent");
        document.getElementById("compose-to").value = "";
        document.getElementById("compose-subject").value = "";
        document.getElementById("compose-body").value = "";
        closeCompose();
        if (state.folder === "sent") {
          await loadMessages();
        }
      } catch (error) {
        setFeedback(feedback, error.message, "error");
      }
    }

    document.getElementById("source-internal").addEventListener("click", () => {
      state.source = "internal";
      document.getElementById("source-internal").classList.add("active");
      document.getElementById("source-external").classList.remove("active");
      loadMessages();
    });

    document.getElementById("source-external").addEventListener("click", () => {
      state.source = "external";
      document.getElementById("source-external").classList.add("active");
      document.getElementById("source-internal").classList.remove("active");
      loadMessages();
    });

    document.querySelectorAll(".folder-btn").forEach((button) => {
      button.addEventListener("click", () => setFolder(button.dataset.folder));
    });

    document.getElementById("refresh-btn").addEventListener("click", loadMessages);
    document.getElementById("empty-trash-btn").addEventListener("click", emptyTrash);
    document.getElementById("compose-open").addEventListener("click", openCompose);
    document.getElementById("compose-close").addEventListener("click", closeCompose);
    document.getElementById("compose-send").addEventListener("click", sendCompose);

    document.getElementById("connect-gmail").addEventListener("click", () => {
      if (!username) return;
      window.location.href = `/gmail/login?username=${encodeURIComponent(username)}`;
    });

    loadMessages();
    checkGmailConnection();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/static/sw.js");
      });
    }
  </script>
</body>
</html>
